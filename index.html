    <script>
      // Ignore Vite HMR WebSocket connection errors in sandbox/iframe environment per instructions
      window.addEventListener('error', function(e) {
        if (e && (
          (e.filename && (e.filename.includes('@vite/client') || e.filename.includes('vite'))) ||
          (e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('failed to connect')))
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      });
    </script>
